<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculators</title>
  <style>
    :root {
      --bg: #f2f3f5;
      --panel: #ffffff;
      --text: #1d2129;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --icon-bg: #e8effd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --panel: #1a1d23;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --border: #2a2f38;
        --accent: #60a5fa;
        --icon-bg: #1e2a40;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    .intro { margin: 0 0 32px; color: var(--muted); font-size: 17px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }
    .card {
      display: block;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      outline: none;
    }
    .icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      border-radius: 12px;
      background: var(--icon-bg);
      color: var(--accent);
      font-size: 22px;
      font-weight: 600;
    }
    .card h2 { margin: 0 0 6px; font-size: 19px; }
    .card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
    .go { display: inline-block; margin-top: 14px; color: var(--accent); font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <h1>Calculators</h1>
    <p class="intro">Pick a tool to get started.</p>

    <div class="cards">
      <a class="card" href="/basic">
        <div class="icon" aria-hidden="true">+−</div>
        <h2>Basic Calculator</h2>
        <p>Add, subtract, multiply and divide.</p>
        <span class="go">Open →</span>
      </a>

      <a class="card" href="/scientific">
        <div class="icon" aria-hidden="true">ƒx</div>
        <h2>Scientific Calculator</h2>
        <p>Trigonometry, powers, roots, logarithms and factorials.</p>
        <span class="go">Open →</span>
      </a>

      <a class="card" href="/converter">
        <div class="icon" aria-hidden="true">⇄</div>
        <h2>Unit Converter</h2>
        <p>Convert length, weight and temperature.</p>
        <span class="go">Open →</span>
      </a>
    </div>
  </main>
</body>
</html>
