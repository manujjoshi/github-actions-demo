<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    :root {
      --bg: #f2f3f5;
      --panel: #ffffff;
      --text: #1d2129;
      --muted: #6b7280;
      --key: #eef0f3;
      --key-hover: #e2e5ea;
      --op: #2563eb;
      --op-hover: #1d4ed8;
      --op-text: #ffffff;
      --fn: #dde1e7;
      --error: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --panel: #1a1d23;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --key: #262a32;
        --key-hover: #30353f;
        --op: #3b82f6;
        --op-hover: #2563eb;
        --fn: #353a45;
        --error: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .calc {
      width: 100%;
      max-width: 340px;
      background: var(--panel);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }
    .home {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
    }
    .home:hover { color: var(--text); }
    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: var(--key);
    }
    .tabs a {
      flex: 1;
      padding: 8px 0;
      border-radius: 9px;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
    }
    .tabs a:hover { color: var(--text); }
    .tabs a[aria-current="page"] {
      background: var(--op);
      color: var(--op-text);
    }
    .screen {
      text-align: right;
      padding: 8px 4px 16px;
      min-height: 96px;
    }
    .expr {
      color: var(--muted);
      font-size: 15px;
      min-height: 20px;
      overflow-wrap: anywhere;
    }
    .value {
      font-size: 44px;
      font-weight: 300;
      overflow-wrap: anywhere;
      line-height: 1.15;
    }
    .value.error { color: var(--error); font-size: 22px; padding-top: 14px; }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      font: inherit;
      font-size: 22px;
      height: 62px;
      border: 0;
      border-radius: 14px;
      background: var(--key);
      color: var(--text);
      cursor: pointer;
      transition: background 0.1s;
    }
    button:hover { background: var(--key-hover); }
    button:active { transform: scale(0.97); }
    button.fn { background: var(--fn); font-size: 18px; }
    button.op { background: var(--op); color: var(--op-text); }
    button.op:hover { background: var(--op-hover); }
    button.op.active { outline: 3px solid var(--text); outline-offset: -3px; }
    button.zero { grid-column: span 2; }
    .busy button { opacity: 0.7; pointer-events: none; }
  </style>
</head>
<body>
  <main class="calc" id="calc">
    <a class="home" href="/">← Home</a>
    <nav class="tabs" aria-label="Tools">
      <a href="/basic" aria-current="page">Basic</a>
      <a href="/scientific">Scientific</a>
      <a href="/converter">Converter</a>
    </nav>
    <div class="screen" aria-live="polite">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">0</div>
    </div>
    <div class="keys">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="negate">+/−</button>
      <button class="fn" data-action="backspace">⌫</button>
      <button class="op" data-op="divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="op" data-op="multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="op" data-op="subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="op" data-op="add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-digit=".">.</button>
      <button class="op" data-action="equals">=</button>
    </div>
  </main>

  <script>
    // All arithmetic is done by the server's API (/add, /subtract, ...)
    const SYMBOLS = { add: '+', subtract: '−', multiply: '×', divide: '÷' };

    const calcEl = document.getElementById('calc');
    const valueEl = document.getElementById('value');
    const exprEl = document.getElementById('expr');

    let display = '0';   // number currently shown
    let stored = null;   // left operand
    let op = null;       // pending operation
    let fresh = true;    // next digit starts a new number
    let busy = false;

    function render(error) {
      valueEl.classList.toggle('error', Boolean(error));
      valueEl.textContent = error || display;
      exprEl.textContent = op ? `${stored} ${SYMBOLS[op]}` : exprEl.textContent;
      document.querySelectorAll('[data-op]').forEach(b =>
        b.classList.toggle('active', b.dataset.op === op && fresh));
    }

    function inputDigit(d) {
      if (fresh) {
        display = d === '.' ? '0.' : d;
        fresh = false;
        if (!op) exprEl.textContent = '';
      } else if (d === '.' && display.includes('.')) {
        return;
      } else {
        display = display === '0' && d !== '.' ? d : display + d;
      }
      render();
    }

    async function compute() {
      const a = stored;
      const b = parseFloat(display);
      busy = true;
      calcEl.classList.add('busy');
      try {
        const res = await fetch(`/${op}?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        exprEl.textContent = `${a} ${SYMBOLS[op]} ${b} =`;
        display = String(parseFloat(data.result.toPrecision(12)));
        return true;
      } catch (err) {
        clearAll();
        render(err.message);
        return false;
      } finally {
        op = null;
        stored = null;
        fresh = true;
        busy = false;
        calcEl.classList.remove('busy');
      }
    }

    async function setOp(newOp) {
      if (op && !fresh) {
        if (!(await compute())) return;
      }
      stored = parseFloat(display);
      op = newOp;
      fresh = true;
      render();
    }

    async function equals() {
      if (!op) return;
      if (await compute()) render();
    }

    function clearAll() {
      display = '0';
      stored = null;
      op = null;
      fresh = true;
      exprEl.textContent = '';
      render();
    }

    function backspace() {
      if (fresh) return;
      display = display.length > 1 ? display.slice(0, -1) : '0';
      if (display === '-') display = '0';
      render();
    }

    function negate() {
      if (display === '0') return;
      display = display.startsWith('-') ? display.slice(1) : '-' + display;
      render();
    }

    function handle(key) {
      if (busy) return;
      if (/^[0-9.]$/.test(key)) return inputDigit(key);
      if (SYMBOLS[key]) return setOp(key);
      if (key === 'equals') return equals();
      if (key === 'clear') return clearAll();
      if (key === 'backspace') return backspace();
      if (key === 'negate') return negate();
    }

    document.querySelector('.keys').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (btn) handle(btn.dataset.digit || btn.dataset.op || btn.dataset.action);
    });

    const KEYMAP = {
      '+': 'add', '-': 'subtract', '*': 'multiply', '/': 'divide',
      'Enter': 'equals', '=': 'equals', 'Backspace': 'backspace', 'Escape': 'clear'
    };
    document.addEventListener('keydown', e => {
      const key = KEYMAP[e.key] || e.key;
      if (/^[0-9.]$/.test(key) || SYMBOLS[key] || ['equals', 'backspace', 'clear'].includes(key)) {
        e.preventDefault();
        handle(key);
      }
    });
  </script>
</body>
</html>
