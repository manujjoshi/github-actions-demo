# ===========================================
# Deploy Workflow - Automatic deployments
# ===========================================
# This workflow demonstrates deployment patterns
# Only runs when code is pushed to main branch

name: Deploy

on:
  push:
    branches: [main]

# Prevent multiple deployments at once
concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  # First: Run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test

  # Second: Build the project
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/

  # Third: Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging        # Requires environment approval (optional)

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Deploy to staging
        run: |
          echo "Deploying to staging server..."
          echo "Files to deploy:"
          ls -la dist/
          echo "Staging deployment complete!"

  # Fourth: Deploy to production (manual approval)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production     # Can require manual approval in GitHub settings
    env:
      SERVICE_URL: https://github-actions-demo-5wtd.onrender.com

    steps:
      # Render pulls this commit from GitHub and builds it itself,
      # so we only need to call the service's deploy hook.
      # Set RENDER_DEPLOY_HOOK_URL in Settings > Secrets and variables > Actions
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          echo "Render response:"
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo

      # The hook only queues a deploy, so wait until the live site
      # reports this commit (Render sets RENDER_GIT_COMMIT in the app)
      - name: Verify deployment is live
        run: |
          for attempt in $(seq 1 45); do
            live=$(curl --silent --max-time 60 "$SERVICE_URL/api" | jq -r '.commit // "unknown"' 2>/dev/null || echo unreachable)
            if [ "$live" = "${{ github.sha }}" ]; then
              echo "Live at $SERVICE_URL with commit $live"
              exit 0
            fi
            echo "Attempt $attempt: live commit is $live, waiting..."
            sleep 20
          done
          echo "::error::$SERVICE_URL did not switch to ${{ github.sha }} within 15 minutes. Check the service's Events tab on Render."
          exit 1
